# Builds the offline maps the Map page can keep (main-site/js/offline.js) that
# are too big for OpenFreeMap's 50 MB: whole countries and regions, to street
# level with the buildings, from OpenStreetMap extracts, with Planetiler's
# OpenMapTiles profile, the same schema as OpenFreeMap's tiles, so its Liberty
# and Dark styles draw them as they are.
#
# Each region goes on the `offline-maps` release as <id>-<build>.pmtiles.000,
# .001, … (1 GiB each: GitHub takes at most 2 GB a file) and <id>.json, which
# names them. /api/mappack reads <id>.json and hands the pieces out (GitHub's
# downloads don't answer a browser on another site). A build's files carry its
# number, and the one before stays up, so a phone halfway through a download
# never gets a mix of two builds.
#
# Runs on the 1st of each month, and from the Actions tab (Run workflow). Add a
# region to the matrix below, to lib/build-map-packs.mjs and to js/offline.js.

name: Offline maps

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-maps
  cancel-in-progress: false

env:
  PLANETILER_VERSION: "0.9.3"
  TAG: offline-maps

jobs:
  # What every region needs: the release, the ocean polygons, Natural Earth and
  # the lake centre lines, fetched once into the cache for the builds.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Offline maps" \
            --notes "The offline maps the Map page keeps, rebuilt monthly from OpenStreetMap by .github/workflows/offline-maps.yml. Data © OpenStreetMap contributors (ODbL), tiles in the OpenMapTiles schema." \
            --prerelease --latest=false

      # The ocean polygons, made by osmdata.openstreetmap.de, which can be slow
      # or down. Then, in turn: osmdata.mapki.com, a daily osmcoastline build
      # of the same file behind Cloudflare, checked against its manifest's
      # SHA-256; www.osmdata.org, a copy of osmdata's; and FAU Erlangen's
      # dated snapshots, newest first. Kept between runs too: the coastline
      # barely changes, so an earlier copy stands in when none answers.
      - name: Ocean polygons from the last run
        uses: actions/cache/restore@v4
        with:
          path: data/sources/water-polygons-split-3857.zip
          key: water-polygons-${{ github.run_id }}
          restore-keys: water-polygons-

      - name: Ocean polygons
        run: |
          mkdir -p data/sources
          f=data/sources/water-polygons-split-3857.zip
          got=
          fetch() { # url [sha256]
            echo "Trying $1"
            curl -fL --retry 3 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 1200 -o "$f.new" "$1" \
              && unzip -tq "$f.new" \
              && { [ -z "$2" ] || echo "$2  $f.new" | sha256sum -c -; } \
              && mv "$f.new" "$f" && got=$1
            rm -f "$f.new"
            [ -n "$got" ]
          }
          fau=https://ftp.fau.de/mirrors/openstreetmapdata.com-archive
          fetch https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip \
            || { sum=$(curl -fsS --max-time 30 https://osmdata.mapki.com/manifest.json \
                   | jq -r '.files["water-polygons-split-3857.zip"] | select(.placeholder | not) | .sha256 // empty') \
                 && [ -n "$sum" ] && fetch https://osmdata.mapki.com/download/water-polygons-split-3857.zip "$sum"; } \
            || fetch https://www.osmdata.org/download/water-polygons-split-3857.zip \
            || for d in $(curl -fsS --max-time 30 "$fau/" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}/' | sort -ru | head -4); do
                 curl -fsI --max-time 30 "$fau/${d}water-polygons-split-3857.zip" >/dev/null \
                   && fetch "$fau/${d}water-polygons-split-3857.zip" && break
               done
          if [ -n "$got" ]; then
            echo "Ocean polygons from $got"
          elif [ -s "$f" ]; then
            echo "::warning::No source answered; using the copy from an earlier run"
          else
            echo "::error::No ocean polygons: no source answered and there is no earlier copy"
            exit 1
          fi
          ls -la "$f"

      - name: Keep the ocean polygons
        uses: actions/cache/save@v4
        with:
          path: data/sources/water-polygons-split-3857.zip
          key: water-polygons-${{ github.run_id }}

      # Natural Earth and the lake centre lines, fetched here rather than by
      # Planetiler, which gives a slow server about ten seconds to say how big
      # a file is. They change once in years: fetched only when missing.
      - name: Natural Earth and lake centre lines from the last run
        id: aux
        uses: actions/cache/restore@v4
        with:
          path: |
            data/sources/natural_earth_vector.sqlite.zip
            data/sources/lake_centerline.shp.zip
          key: planetiler-aux-v1

      - name: Natural Earth and lake centre lines
        if: steps.aux.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/sources
          get() { curl -fL --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 1200 -o "$1" "$2" && unzip -tq "$1"; }
          get data/sources/natural_earth_vector.sqlite.zip https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip
          get data/sources/lake_centerline.shp.zip https://github.com/acalcutt/osm-lakelines/releases/download/v12/lake_centerline.shp.zip

      - name: Keep Natural Earth and lake centre lines
        if: steps.aux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/sources/natural_earth_vector.sqlite.zip
            data/sources/lake_centerline.shp.zip
          key: planetiler-aux-v1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Gentle on Geofabrik, which asks for few downloads at a time.
      max-parallel: 4
      matrix:
        # sources: one way of getting the region per line, tried in turn; a
        # line of several files is merged. Each file has its .md5 beside it.
        # bounds: w,s,e,n, given outright: the map stops there, whatever the
        # files hold, so a bigger extract can stand in for a smaller one.
        include:
          - id: malaysia
            bounds: 99.0,0.7,119.5,7.6
            sources: |
              https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
              https://download.openstreetmap.fr/extracts/asia/malaysia.osm.pbf https://download.openstreetmap.fr/extracts/asia/singapore.osm.pbf https://download.openstreetmap.fr/extracts/asia/brunei.osm.pbf
          - id: taiwan
            bounds: 118.1,21.7,122.1,26.5
            sources: |
              https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
          - id: hong-kong-sar
            bounds: 113.8,22.1,114.5,22.6
            sources: |
              https://download.openstreetmap.fr/extracts/asia/china/hong_kong.osm.pbf
          - id: thailand
            bounds: 97.2,5.5,105.8,20.6
            sources: |
              https://download.geofabrik.de/asia/thailand-latest.osm.pbf
          - id: south-korea
            bounds: 124.5,33.0,131.0,38.7
            sources: |
              https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
          - id: japan
            bounds: 122.9,24.0,146.0,45.6
            sources: |
              https://download.geofabrik.de/asia/japan-latest.osm.pbf
              https://download.openstreetmap.fr/extracts/asia/japan.osm.pbf
          - id: indonesia
            bounds: 94.9,-11.1,141.1,6.1
            sources: |
              https://download.geofabrik.de/asia/indonesia-latest.osm.pbf
              https://download.openstreetmap.fr/extracts/asia/indonesia.osm.pbf
          - id: philippines
            bounds: 116.8,4.5,126.8,21.2
            sources: |
              https://download.geofabrik.de/asia/philippines-latest.osm.pbf
              https://download.openstreetmap.fr/extracts/asia/philippines.osm.pbf
          - id: vietnam
            bounds: 102.0,8.3,109.6,23.5
            sources: |
              https://download.geofabrik.de/asia/vietnam-latest.osm.pbf
          - id: greater-london
            bounds: -0.56,51.25,0.34,51.72
            sources: |
              https://download.geofabrik.de/europe/united-kingdom/england/greater-london-latest.osm.pbf
              https://download.openstreetmap.fr/extracts/europe/united_kingdom/england/greater_london.osm.pbf
          - id: ile-de-france
            bounds: 1.4,48.1,3.6,49.25
            sources: |
              https://download.geofabrik.de/europe/france/ile-de-france-latest.osm.pbf
              https://download.openstreetmap.fr/extracts/europe/france/ile_de_france.osm.pbf
          - id: netherlands
            bounds: 3.2,50.7,7.3,53.7
            sources: |
              https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
              https://download.openstreetmap.fr/extracts/europe/netherlands.osm.pbf
          - id: catalonia
            bounds: 0.15,40.5,3.35,42.9
            sources: |
              https://download.geofabrik.de/europe/spain/cataluna-latest.osm.pbf
              https://download.openstreetmap.fr/extracts/europe/spain/catalunya.osm.pbf
          - id: lazio
            bounds: 11.4,40.7,14.05,42.85
            sources: |
              https://download.openstreetmap.fr/extracts/europe/italy/lazio.osm.pbf
              https://download.geofabrik.de/europe/italy/centro-latest.osm.pbf
          - id: new-york-state
            bounds: -79.8,40.45,-71.8,45.05
            sources: |
              https://download.geofabrik.de/north-america/us/new-york-latest.osm.pbf
              https://download.openstreetmap.fr/extracts/north-america/us-northeast/new-york.osm.pbf
          - id: northern-california
            bounds: -124.6,35.7,-117.6,42.05
            sources: |
              https://download.geofabrik.de/north-america/us/california/norcal-latest.osm.pbf
              https://download.openstreetmap.fr/extracts/north-america/us-west/california.osm.pbf
          - id: british-columbia
            bounds: -139.1,48.2,-114.0,60.05
            sources: |
              https://download.geofabrik.de/north-america/canada/british-columbia-latest.osm.pbf
              https://download.openstreetmap.fr/extracts/north-america/canada/british_columbia.osm.pbf
          - id: new-south-wales
            bounds: 140.9,-37.6,153.7,-28.1
            sources: |
              https://download.openstreetmap.fr/extracts/oceania/australia/new_south_wales.osm.pbf
              https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
    env:
      ID: ${{ matrix.id }}
      BOUNDS: ${{ matrix.bounds }}
      SOURCES: ${{ matrix.sources }}
    steps:
      # The runner's preinstalled toolchains, which Japan's 2.9 GB extract and
      # its working files need the room of.
      - name: Room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Planetiler
        run: curl -fsSL --retry 3 -o planetiler.jar "https://github.com/onthegomap/planetiler/releases/download/v${PLANETILER_VERSION}/planetiler.jar"

      - name: Ocean polygons
        uses: actions/cache/restore@v4
        with:
          path: data/sources/water-polygons-split-3857.zip
          key: water-polygons-${{ github.run_id }}
          restore-keys: water-polygons-
          fail-on-cache-miss: true

      - name: Natural Earth and lake centre lines
        uses: actions/cache/restore@v4
        with:
          path: |
            data/sources/natural_earth_vector.sqlite.zip
            data/sources/lake_centerline.shp.zip
          key: planetiler-aux-v1
          fail-on-cache-miss: true

      # This month's OpenStreetMap for the region: each way in SOURCES in
      # turn, every file checked against its MD5; several files are merged
      # with osmium, one version of each object.
      - name: OpenStreetMap extract
        run: |
          set -o pipefail
          mkdir -p data/sources
          out=data/sources/$ID.osm.pbf
          get() { # file url: the file and its .md5, and the two must agree
            echo "Trying $2"
            curl -fL --retry 3 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 3600 -o "$1" "$2" \
              && sum=$(curl -fsSL --retry 3 --retry-all-errors --max-time 60 "$2.md5" | cut -d' ' -f1) \
              && [ -n "$sum" ] && echo "$sum  $1" | md5sum -c -
          }
          ok=
          while read -r line; do
            [ -z "$line" ] && continue
            set -- $line
            if [ $# -eq 1 ]; then
              get "$out" "$1" && ok=$1 && break
            else
              n=0; all=1
              for url in "$@"; do n=$((n + 1)); get "data/sources/part-$n.osm.pbf" "$url" || { all=; break; }; done
              if [ -n "$all" ]; then
                command -v osmium >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null; }
                # Where they overlap at the borders, an object can come in two
                # versions; time-filter keeps the one in force now.
                osmium merge data/sources/part-*.osm.pbf -o data/sources/merged.osm.pbf --overwrite \
                  && osmium time-filter data/sources/merged.osm.pbf -o "$out" --overwrite && ok=$line
                rm -f data/sources/part-*.osm.pbf data/sources/merged.osm.pbf
                [ -n "$ok" ] && break
              fi
            fi
            echo "::warning::$ID: didn't get it from $line"
            rm -f "$out" data/sources/part-*.osm.pbf
          done <<< "$SOURCES"
          [ -n "$ok" ] || { echo "::error::$ID: no source answered"; exit 1; }
          echo "From $ok"
          ls -la "$out"

      # Everything is here, so --download fetches nothing. Node locations go
      # in a memory-mapped file, which keeps a big country within the runner's
      # 16 GB. Zoom 14, as OpenFreeMap's, with the buildings at 14.
      - name: Build
        run: |
          java -Xmx8g -jar planetiler.jar \
            --download \
            --osm-path="data/sources/$ID.osm.pbf" \
            --bounds="$BOUNDS" \
            --maxzoom=14 \
            --storage=mmap \
            --output="$ID.pmtiles" \
            --force
          rm -f "data/sources/$ID.osm.pbf"
          head -c 7 "$ID.pmtiles" | grep -q PMTiles
          ls -la "$ID.pmtiles"

      # The archive in 1 GiB pieces (a multiple of /api/mappack's 4 MiB, so
      # none of its pieces spans two files), then the manifest naming them,
      # then the builds before the last two taken down.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD: ${{ github.run_id }}
        run: |
          set -eo pipefail
          base="$ID-$BUILD.pmtiles"
          split -b 1073741824 -d -a 3 "$ID.pmtiles" "$base."
          jq -n --arg id "$ID" --arg build "$BUILD" --argjson size "$(stat -c %s "$ID.pmtiles")" \
            --argjson files "$(for f in "$base".*; do jq -n --arg name "$f" --argjson size "$(stat -c %s "$f")" '{name: $name, size: $size}'; done | jq -s .)" \
            '{id: $id, build: $build, size: $size, built: (now | todate), files: $files}' > "$ID.json"
          cat "$ID.json"
          gh release upload "$TAG" "$base".* --clobber
          gh release upload "$TAG" "$ID.json" --clobber
          # The builds before the last two, and the single file the first
          # build used.
          gh release view "$TAG" --json assets -q '.assets[].name' > assets.txt
          old=$(grep -oE "^$ID-[0-9]+\.pmtiles\." assets.txt | sed -E "s/^$ID-([0-9]+)\..*/\1/" | sort -un | head -n -2 || true)
          for n in $old; do
            grep -F "$ID-$n.pmtiles." assets.txt | while read -r a; do gh release delete-asset "$TAG" "$a" -y; done
          done
          if grep -qx "$ID.pmtiles" assets.txt; then gh release delete-asset "$TAG" "$ID.pmtiles" -y; fi
