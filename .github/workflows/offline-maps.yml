# Builds the offline map of Malaysia, Singapore and Brunei that the Map page can
# keep (main-site/js/offline.js), from Geofabrik's OpenStreetMap extract, with
# Planetiler's OpenMapTiles profile: the same schema as OpenFreeMap's tiles, so
# its Liberty and Dark styles draw it as they are. The archive goes on the
# `offline-maps` release as malaysia.pmtiles, which /api/mappack hands out in
# pieces (GitHub's downloads don't answer a browser on another site).
#
# Runs on the 1st of each month, and from the Actions tab (Run workflow).

name: Offline maps

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-maps
  cancel-in-progress: false

env:
  PLANETILER_VERSION: "0.9.3"
  AREA: malaysia-singapore-brunei
  OUTPUT: malaysia.pmtiles
  TAG: offline-maps

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Planetiler
        run: curl -fsSL -o planetiler.jar "https://github.com/onthegomap/planetiler/releases/download/v${PLANETILER_VERSION}/planetiler.jar"

      # The ocean polygons, made by osmdata.openstreetmap.de, which can be slow
      # or down. Then, in turn: osmdata.mapki.com, a daily osmcoastline build
      # of the same file behind Cloudflare, checked against its manifest's
      # SHA-256; www.osmdata.org, a copy of osmdata's; and FAU Erlangen's
      # dated snapshots, newest first. Kept between runs too: the coastline
      # barely changes, so an earlier copy stands in when none answers.
      - name: Ocean polygons from the last run
        uses: actions/cache/restore@v4
        with:
          path: data/sources/water-polygons-split-3857.zip
          key: water-polygons-${{ github.run_id }}
          restore-keys: water-polygons-

      - name: Ocean polygons
        run: |
          mkdir -p data/sources
          f=data/sources/water-polygons-split-3857.zip
          got=
          fetch() { # url [sha256]
            echo "Trying $1"
            curl -fL --retry 3 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 1200 -o "$f.new" "$1" \
              && unzip -tq "$f.new" \
              && { [ -z "$2" ] || echo "$2  $f.new" | sha256sum -c -; } \
              && mv "$f.new" "$f" && got=$1
            rm -f "$f.new"
            [ -n "$got" ]
          }
          fau=https://ftp.fau.de/mirrors/openstreetmapdata.com-archive
          fetch https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip \
            || { sum=$(curl -fsS --max-time 30 https://osmdata.mapki.com/manifest.json \
                   | jq -r '.files["water-polygons-split-3857.zip"] | select(.placeholder | not) | .sha256 // empty') \
                 && [ -n "$sum" ] && fetch https://osmdata.mapki.com/download/water-polygons-split-3857.zip "$sum"; } \
            || fetch https://www.osmdata.org/download/water-polygons-split-3857.zip \
            || for d in $(curl -fsS --max-time 30 "$fau/" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}/' | sort -ru | head -4); do
                 curl -fsI --max-time 30 "$fau/${d}water-polygons-split-3857.zip" >/dev/null \
                   && fetch "$fau/${d}water-polygons-split-3857.zip" && break
               done
          if [ -n "$got" ]; then
            echo "Ocean polygons from $got"
          elif [ -s "$f" ]; then
            echo "::warning::No source answered; using the copy from an earlier run"
          else
            echo "::error::No ocean polygons: no source answered and there is no earlier copy"
            exit 1
          fi
          ls -la "$f"

      - name: Keep the ocean polygons
        uses: actions/cache/save@v4
        with:
          path: data/sources/water-polygons-split-3857.zip
          key: water-polygons-${{ github.run_id }}

      # Planetiler's other inputs, Natural Earth and the lake centre lines,
      # fetched here rather than by Planetiler, which gives a slow server about
      # ten seconds to say how big a file is. They change once in years, so
      # they're kept between runs and only fetched when missing.
      - name: Natural Earth and lake centre lines from the last run
        id: aux
        uses: actions/cache/restore@v4
        with:
          path: |
            data/sources/natural_earth_vector.sqlite.zip
            data/sources/lake_centerline.shp.zip
          key: planetiler-aux-v1

      - name: Natural Earth and lake centre lines
        if: steps.aux.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/sources
          get() { curl -fL --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 1200 -o "$1" "$2" && unzip -tq "$1"; }
          get data/sources/natural_earth_vector.sqlite.zip https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip
          get data/sources/lake_centerline.shp.zip https://github.com/acalcutt/osm-lakelines/releases/download/v12/lake_centerline.shp.zip

      - name: Keep Natural Earth and lake centre lines
        if: steps.aux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/sources/natural_earth_vector.sqlite.zip
            data/sources/lake_centerline.shp.zip
          key: planetiler-aux-v1

      # This month's OpenStreetMap: Geofabrik's malaysia-singapore-brunei
      # extract, checked against its MD5; or, when Geofabrik doesn't answer,
      # openstreetmap.fr's Malaysia, Singapore and Brunei, each checked against
      # its MD5, merged into one with osmium, one version of each object.
      - name: OpenStreetMap extract
        run: |
          set -eo pipefail
          mkdir -p data/sources
          out=data/sources/$AREA.osm.pbf
          get() { # file url: the file and its .md5, and the two must agree
            echo "Trying $2"
            curl -fL --retry 3 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 1800 -o "$1" "$2" \
              && sum=$(curl -fsSL --retry 3 --retry-all-errors --max-time 60 "$2.md5" | cut -d' ' -f1) \
              && [ -n "$sum" ] && echo "$sum  $1" | md5sum -c -
          }
          if get "$out" "https://download.geofabrik.de/asia/$AREA-latest.osm.pbf"; then
            echo "From Geofabrik"
          else
            echo "::warning::Geofabrik didn't answer; merging openstreetmap.fr's extracts"
            rm -f "$out"
            fr=https://download.openstreetmap.fr/extracts/asia
            for c in malaysia singapore brunei; do get "data/sources/fr-$c.osm.pbf" "$fr/$c.osm.pbf"; done
            sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
            # Where the three overlap at the borders, an object can come in two
            # versions; time-filter keeps the one in force now.
            osmium merge data/sources/fr-*.osm.pbf -o data/sources/fr-merged.osm.pbf --overwrite
            osmium time-filter data/sources/fr-merged.osm.pbf -o "$out" --overwrite
            rm -f data/sources/fr-*.osm.pbf
          fi
          ls -la "$out"

      # Everything is here, so --download fetches nothing. The bounds are the
      # extract's box, given outright so the ocean stops at its edges whatever
      # the file's header says. Zoom 14, as OpenFreeMap's, with the buildings
      # at 14.
      - name: Build
        run: |
          java -Xmx10g -jar planetiler.jar \
            --download \
            --osm-path="data/sources/$AREA.osm.pbf" \
            --bounds=99.0,0.7,119.5,7.6 \
            --maxzoom=14 \
            --output="$OUTPUT" \
            --force
          ls -la "$OUTPUT"

      - name: Check
        run: |
          head -c 7 "$OUTPUT" | grep -q PMTiles
          size=$(stat -c %s "$OUTPUT")
          echo "size $size"
          test "$size" -gt 50000000

      # A fixed tag and file name, so the address never changes; the file is
      # replaced in place, and phones see the new one by its ETag.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Offline maps" \
            --notes "The offline map of Malaysia, Singapore and Brunei that the Map page keeps, rebuilt monthly from OpenStreetMap by .github/workflows/offline-maps.yml. Data © OpenStreetMap contributors (ODbL), tiles in the OpenMapTiles schema." \
            --prerelease --latest=false
          gh release upload "$TAG" "$OUTPUT" --clobber
